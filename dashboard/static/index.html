<!doctype html>
<html lang="{{t:lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<style>
:root{--paper:#F3F5F2;--ink:#17262B;--mute:#5F7177;--line:#D4DBD6;--ok:#2F7D5B;--warn:#B8641B;--bad:#A8382F;--panel:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--paper:#15201F;--ink:#E7EDE9;--mute:#9BAAA6;--line:#2B3A38;--panel:#1C2A28;--ok:#4FAE82;--warn:#D9893F;--bad:#E5776B}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
header{padding:28px 24px 8px;max-width:960px;margin:0 auto}
header h1{font-weight:400;font-size:40px;margin:0;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--mute);font-family:system-ui,sans-serif;font-size:14px}
header form{margin-top:10px}
main{max-width:960px;margin:0 auto;padding:12px 24px 60px;display:grid;gap:28px}
section h2{font-weight:400;font-size:22px;margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.brief{white-space:pre-wrap;font-size:18px;line-height:1.6}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.item:last-child{border-bottom:0}
.item .t{font-family:system-ui,sans-serif;font-size:15px}
.item .t small{display:block;color:var(--mute);margin-top:2px}
.item .t .w{color:var(--warn)}
.item details{margin-top:6px}.item summary{cursor:pointer;color:var(--mute);font-size:14px}
.item pre{white-space:pre-wrap;word-break:break-word;font:14px/1.5 system-ui,sans-serif;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin:6px 0 0;max-height:320px;overflow:auto}
.note{color:var(--bad);font-family:system-ui,sans-serif;font-size:15px;margin:0 0 10px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
button{font:14px system-ui,sans-serif;padding:7px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
button.ok{border-color:var(--ok);color:var(--ok)}button.drop{border-color:var(--bad);color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-family:system-ui,sans-serif;font-size:15px}
.row:last-child{border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.g{background:var(--ok)}.y{background:var(--warn)}.r{background:var(--bad)}.n{background:var(--line)}
.empty{color:var(--mute);font-family:system-ui,sans-serif;font-size:15px}
.log{font-family:system-ui,sans-serif;font-size:14px;color:var(--mute);line-height:1.7}
.keyform{display:grid;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
.keyform h3{font-weight:400;font-size:18px;margin:0}
.keyform .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.keyform label{display:grid;gap:4px;color:var(--mute);font:14px system-ui,sans-serif}
.keyform input,.keyform select{font:15px system-ui,sans-serif;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0;width:100%;min-height:42px}
.keyform input:focus-visible,.keyform select:focus-visible{outline:2px solid var(--ok);outline-offset:1px}
.keyform .pw{display:flex;gap:6px}.keyform .pw input{flex:1}
.keyform .tech:empty{display:none}
.keyform .tech{margin:0;color:var(--mute);font:14px/1.5 system-ui,sans-serif;overflow-wrap:anywhere}
.keyform [hidden]{display:none}
button:disabled,input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
#keys .item .t{overflow-wrap:anywhere}
#keybox .hint,#keybox .note{max-width:62ch}
.hint{color:var(--mute);font-family:system-ui,sans-serif;font-size:14px;margin:8px 0 0}
@media(min-width:760px){.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}.keyform{grid-template-columns:1fr 1fr}.keyform .wide{grid-column:1/-1}}
</style>
</head>
<body>
<header><h1>{{NAME}}</h1><p id="stamp">{{t:loading}}</p><form method="post" action="/logout" id="out" hidden><button>{{t:sign_out}}</button></form></header>
<main>
  <section><h2>{{t:today}}</h2><div class="brief" id="brief"></div></section>
  <section><h2>{{t:orders}}</h2><div id="ordsum" class="brief"></div><div id="orderr"></div><div id="orders"></div></section>
  <section><h2>{{t:news}}</h2><div class="log" id="news"></div></section>
  <section><h2>{{t:awaiting}}</h2><div id="problems"></div><div id="approvals"></div></section>
  <section id="decidedBox" hidden><h2>{{t:decided}}</h2><div id="decided"></div></section>
  <section id="closedBox" hidden><h2>{{t:closed}}</h2><div id="closed"></div></section>
  <div class="two">
    <section><h2>{{t:team}}</h2><div id="team"></div></section>
    <section><h2>{{t:connections}}</h2><div id="connectors"></div></section>
  </div>
  <section id="keybox"><h2>{{t:keys}}</h2><p class="note" id="keyinsecure" hidden></p><div id="keyprob"></div><div id="keys"></div><div id="keyimport"></div>
    <form id="keyform" class="keyform" autocomplete="off">
      <div class="head wide"><h3 id="keytitle">{{t:key_form_add}}</h3><button type="button" id="keycancel" hidden>{{t:key_cancel}}</button></div>
      <label>{{t:key_name}}<select id="keysvc" required><option value="">{{t:key_pick}}</option></select></label>
      <label id="keywhichl" hidden>{{t:key_which}}<select id="keywhich"></select></label>
      <label id="keyownl" hidden>{{t:key_own_name}}<input id="keyown" maxlength="60" spellcheck="false" autocomplete="off" placeholder="{{t:key_own_ph}}"></label>
      <p class="tech wide" id="keytech" aria-live="polite"></p>
      <label class="wide">{{t:key_value}}<span class="pw"><input id="keyval" type="password" required autocomplete="new-password" spellcheck="false" autocapitalize="off" autocorrect="off"><button type="button" id="keyshow" aria-pressed="false" aria-controls="keyval">{{t:key_show}}</button></span></label>
      <div class="acts wide"><button class="ok" id="keysave">{{t:key_save}}</button><button type="button" id="keytest" hidden>{{t:key_test}}</button></div>
    </form>
    <p class="hint" id="keymsg" aria-live="polite">{{t:key_hint}}</p>
  </section>
  <section><h2>{{t:schedule}}</h2><div id="schedule"></div></section>
  <section><h2>{{t:autonomy}}</h2><div id="autonomy"></div></section>
  <section><h2>{{t:log}}</h2><div class="log" id="log"></div></section>
</main>
<script>
// The words come from core/locale/<lang>.json, put in by the server (dashboard/app.py page()); {name} fields are filled here.
const T={{TEXTS}};
const tr=(k,v={})=>String(T['dash.'+k]??k).replace(/\{(\w+)\}/g,(m,n)=>n in v?String(v[n]):m);
const H={'Content-Type':'application/json'};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  const r=await fetch('/api/state',{headers:H});
  if(r.status===401){location.href='/login';return;}
  if(!r.ok){el('stamp').textContent=(await r.json().catch(()=>({}))).detail||tr('could_not_load',{code:r.status});return;}
  const s=await r.json();
  el('out').hidden=!s.auth;
  el('stamp').textContent=tr('updated',{time:new Date().toLocaleTimeString(T['dash.lang']||[],{hour:'2-digit',minute:'2-digit'})});
  el('brief').textContent=s.brief||tr('no_brief',{name:s.name});
  el('problems').innerHTML=s.problems.map(p=>`<p class="note">${esc(p)}</p>`).join('');
  const head=a=>`${esc(a.title||a.id)}<small>${esc(a.agent)}${a.label||a.action?' · '+esc(a.label||a.action):''}${a.summary?' · '+esc(a.summary):''}</small>`;
  const by=st=>s.approvals.filter(a=>a.state===st);
  el('approvals').innerHTML=by('pending').length?by('pending').map(a=>`<div class="item"><div class="t">${head(a)}
    ${a.warning?`<small class="w">${esc(tr('not_sendable',{warning:a.warning}))}</small>`:''}
    ${a.preview?`<details><summary>${esc(tr('show_text'))}</summary><pre>${esc(a.preview)}${a.cut?'\n…':''}</pre></details>`:''}</div>
    <div class="acts"><button class="ok" data-id="${esc(a.id)}" data-d="ok">${esc(tr('approve'))}</button><button data-id="${esc(a.id)}" data-d="edit">${esc(tr('change'))}</button><button class="drop" data-id="${esc(a.id)}" data-d="drop">${esc(tr('drop'))}</button></div></div>`).join('')
    :`<p class="empty">${esc(tr('nothing_waiting'))}</p>`;
  el('decidedBox').hidden=!by('decided').length;
  el('decided').innerHTML=by('decided').map(a=>`<div class="item"><div class="t">${head(a)}
    <small class="${a.warning?'w':''}">${esc(a.status[0].toUpperCase()+a.status.slice(1))}${a.note?' · “'+esc(a.note)+'”':''}</small></div>
    <div class="acts"><button data-id="${esc(a.id)}" data-d="undo">${esc(tr('undo'))}</button></div></div>`).join('');
  el('closedBox').hidden=!by('consumed').length;
  el('closed').innerHTML=by('consumed').map(a=>`<div class="row"><span>${esc(a.title||a.id)}</span><span>${esc(a.status)}${a.result?' · '+esc(a.result):''}</span></div>`).join('');
  el('autonomy').innerHTML=s.autonomy.map(a=>`<div class="row"><span>${esc(a.label||a.action)}</span><span>${esc(a.name)}${a.locked?' · '+esc(tr('locked'))+(a.max_level>a.level?', '+esc(tr('at_most',{name:a.max_name})):''):''}</span></div>`).join('');
  el('team').innerHTML=s.team.length?s.team.map(t=>`<div class="row"><span><span class="dot ${t.state==='failed'?'r':t.state==='problem'?'y':t.state==='working'?(t.ago_min<60?'y':'r'):'g'}"></span>${esc(t.agent)}</span><span>${esc(t.ago_min<60?tr('min_ago',{n:t.ago_min}):tr('h_ago',{n:Math.round(t.ago_min/60)}))} · ${esc(t.note)}</span></div>`).join('')
    :`<p class="empty">${esc(tr('no_team'))}</p>`;
  el('connectors').innerHTML=s.connectors.map(c=>`<div class="row"><span><span class="dot ${c.ok===null?'n':c.ok?'g':'r'}"></span>${esc(c.name)}</span><span>${esc(tr(c.ok===null?'no_key':c.ok?'connected':'missing_key'))}</span></div>`).join('');
  el('schedule').innerHTML=s.schedule===null?`<p class="empty">${esc(tr('schedule_unreadable'))}</p>`
    :s.schedule.map(j=>`<div class="row"><span><span class="dot ${!j.on?'n':/fail|missed/.test(j.result)?'r':'g'}"></span>${esc(j.name)}</span><span>${j.on?esc(j.when)+' · '+esc(tr('next',{when:j.next_text}))+(j.last_text?' · '+esc(tr('last',{when:j.last_text,result:j.result_text||j.result})):''):esc(tr('off',{why:j.off}))}</span></div>`).join('');
  el('news').innerHTML=(s.news||[]).length?s.news.map(n=>esc(n.text)).join('<br>'):`<span class="empty">${esc(tr('no_news'))}</span>`;
  el('log').innerHTML=s.log.length?s.log.map(esc).join('<br>'):`<span class="empty">${esc(tr('no_log'))}</span>`;
}
async function loadOrders(){
  const r=await fetch('/api/orders',{headers:H}); if(!r.ok){el('ordsum').textContent=tr('orders_unavailable',{code:r.status});return;}
  const o=await r.json(), s=o.summary;
  el('ordsum').textContent=tr('orders_summary',{orders:s.orders,revenue:s.revenue,currency:s.currency,no_invoice:s.no_invoice===null?tr('unknown'):s.no_invoice,no_label:s.no_label});
  el('orderr').innerHTML=o.errors.map(p=>`<p class="note">${esc(p)}</p>`).join('');
  el('orders').innerHTML=o.orders.map(x=>`<div class="row"><span><span class="dot ${x.cancelled?'n':x.invoice===false?'r':x.invoice===null?'y':'g'}"></span>${esc(x.name)} · ${esc(x.total)} ${esc(x.currency)}</span><span>${esc(x.cancelled?tr('cancelled'):(x.invoice===null?tr('invoice_unknown'):x.invoice?tr('invoice',{number:x.invoice.number}):tr('no_invoice')))} · ${x.label?esc(tr('tracking',{number:x.tracking[0]})):esc(x.shipped)}</span></div>`).join('')||`<p class="empty">${esc(tr('no_orders'))}</p>`;
}
// --- Your keys. Values only ever go from this page to the server, never back: the list has names, labels and dates.
let KS={services:[],keys:[],secure:true};
const kdate=v=>v?new Date(v).toLocaleDateString(T['dash.lang']||[],{year:'numeric',month:'short',day:'numeric'}):'';
const ktitle=x=>x.used_by&&x.service!=='own'?x.used_by+' – '+x.label:x.label;
function keyChoices(){
  const known=new Set(KS.services.flatMap(s=>s.keys.map(k=>k.name)));
  const own=KS.keys.filter(k=>k.where==='stored'&&!known.has(k.name)).map(k=>({name:k.name,label:ktitle(k),check:false}));
  return own.length?[...KS.services,{id:'own',name:tr('key_own'),keys:own}]:KS.services;
}
function chosen(){
  const sid=el('keysvc').value;
  if(sid==='__other'){const t=el('keyown').value.trim();return t?{own:t}:null;}
  const s=keyChoices().find(x=>x.id===sid); if(!s)return null;
  const k=s.keys.find(k=>k.name===el('keywhich').value)||s.keys[0];
  return k?{...k,title:s.id==='own'?k.label:s.name+' – '+k.label}:null;
}
function fillSvc(){
  const sel=el('keysvc'),keep=sel.value;
  sel.innerHTML=`<option value="">${esc(tr('key_pick'))}</option>`+keyChoices().map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')
    +`<option value="__other">${esc(tr('key_other'))}</option>`;
  sel.value=keep; if(sel.value!==keep)sel.value='';
  svcChanged();
}
function svcChanged(){
  const sid=el('keysvc').value,s=keyChoices().find(x=>x.id===sid),w=el('keywhich'),keep=w.value;
  w.innerHTML=s?s.keys.map(k=>`<option value="${esc(k.name)}">${esc(s.id==='own'?k.label:s.name+' – '+k.label)}</option>`).join(''):'';
  if(s&&s.keys.some(k=>k.name===keep))w.value=keep;
  el('keywhichl').hidden=!(s&&s.keys.length>1);
  el('keyownl').hidden=sid!=='__other';
  whichChanged();
}
let ownTimer=0;
function whichChanged(){
  const sid=el('keysvc').value,c=chosen();
  el('keytest').hidden=!(c&&c.check);
  clearTimeout(ownTimer);
  if(sid!=='__other'){
    const row=c&&KS.keys.find(k=>k.name===c.name);
    el('keytech').textContent=c?tr(row&&row.where==='stored'?'key_tech_exists':'key_tech',{name:c.name}):'';
    return;
  }
  const t=el('keyown').value.trim();
  if(!t){el('keytech').textContent='';return;}
  ownTimer=setTimeout(async()=>{  // the server makes the name, so what is shown is what is stored
    const r=await fetch('/api/keys/name?label='+encodeURIComponent(t),{headers:H});
    const j=await r.json().catch(()=>({}));
    if(el('keyown').value.trim()!==t||el('keysvc').value!=='__other')return;
    el('keytech').textContent=r.ok?tr(j.exists?'key_tech_exists':'key_tech',{name:j.name}):(j.detail||tr('failed',{code:r.status}));
  },250);
}
function hideValue(){el('keyval').type='password';el('keyshow').textContent=tr('key_show');el('keyshow').setAttribute('aria-pressed','false');}
function resetKeyForm(){
  el('keysvc').value='';el('keyown').value='';el('keyval').value='';hideValue();
  el('keytitle').textContent=tr('key_form_add');el('keycancel').hidden=true;svcChanged();
}
async function loadKeys(){
  const r=await fetch('/api/keys',{headers:H}); if(!r.ok){el('keys').innerHTML=`<p class="empty">${esc(tr('keys_unavailable',{code:r.status}))}</p>`;return;}
  const k=await r.json(); KS=k;
  el('keyinsecure').hidden=k.secure; el('keyinsecure').textContent=k.insecure||'';
  el('keyprob').innerHTML=[k.error,...k.problems].filter(Boolean).map(p=>`<p class="note">${esc(p)}</p>`).join('')+k.notes.map(p=>`<p class="hint">${esc(p)}</p>`).join('');
  const order={stored:0,plain:1,unset:2};  // what is there first, then what is still missing
  const list=k.keys.slice().sort((a,b)=>order[a.where]-order[b.where]||ktitle(a).localeCompare(ktitle(b)));
  el('keys').innerHTML=list.map(x=>{  // the title already says who uses it ("Shopify – ..."); only an own key says nobody does
    const meta=[x.name,x.used_by?'':tr('key_used_by_none'),tr('where_'+x.where),
      x.at?tr('key_when_'+(x.action||'stored'),{date:kdate(x.at)}):''].filter(Boolean);
    const b=(act,cls,word)=>`<button type="button"${cls?` class="${cls}"`:''} data-kact="${act}" data-name="${esc(x.name)}">${esc(tr(word))}</button>`;
    const acts=x.where==='stored'?b('replace','','key_replace')+b('delete','drop','key_delete'):x.where==='unset'?b('replace','','key_set'):'';
    return `<div class="item"><div class="t"><span class="dot ${x.where==='stored'?'g':x.where==='plain'?'r':'n'}"></span>${esc(ktitle(x))}<small>${meta.map(esc).join(' · ')}</small></div><div class="acts">${acts}</div></div>`;
  }).join('');
  el('keyimport').innerHTML=k.plain.length?`<p class="note">${esc(tr('keys_plain',{names:k.plain.join(', ')}))}</p><div class="acts"><button class="ok" id="keyimp">${esc(tr('key_import'))}</button></div>`:'';
  fillSvc();
  document.querySelectorAll('#keybox button, #keybox input, #keybox select').forEach(x=>{x.disabled=!k.secure;});
}
el('keysvc').addEventListener('change',()=>{el('keyown').value='';svcChanged();});
el('keywhich').addEventListener('change',whichChanged);
el('keyown').addEventListener('input',whichChanged);
el('keycancel').addEventListener('click',()=>{resetKeyForm();el('keymsg').textContent=tr('key_hint');});
el('keyshow').addEventListener('click',()=>{const v=el('keyval'),show=v.type==='password';
  v.type=show?'text':'password';el('keyshow').textContent=tr(show?'key_hide':'key_show');el('keyshow').setAttribute('aria-pressed',String(show));});
el('keyform').addEventListener('submit',async e=>{e.preventDefault();
  const c=chosen(),v=el('keyval').value;
  if(!c||!v.trim()){el('keymsg').textContent=tr(c||el('keysvc').value!=='__other'?'key_bad':'key_bad_label');return;}
  const r=await fetch('/api/keys',{method:'POST',headers:H,body:JSON.stringify(c.own?{label:c.own,value:v}:{name:c.name,value:v})});
  el('keyval').value='';hideValue();  // the value leaves the page at once, whatever the answer
  const j=await r.json().catch(()=>({}));
  el('keymsg').textContent=r.ok?tr(j.replaced?'key_replaced':'key_stored',{label:c.own||c.title,name:j.name}):(j.detail||tr('failed',{code:r.status}));
  if(r.ok){resetKeyForm();loadKeys();load();}});
el('keytest').addEventListener('click',async()=>{const c=chosen();if(!c)return;
  el('keymsg').textContent=tr('key_testing');
  const r=await fetch('/api/keys/test',{method:'POST',headers:H,body:JSON.stringify({name:c.name,value:el('keyval').value})});
  const j=await r.json().catch(()=>({}));
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1)+(/[.!?]$/.test(s)?'':'.');
  el('keymsg').textContent=!r.ok?(j.detail||tr('failed',{code:r.status})):j.ok?(j.reason?cap(j.reason):tr('key_test_ok')):tr('key_test_bad',{reason:j.reason||'?'});});
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-kact]');if(!b)return;
  const x=KS.keys.find(k=>k.name===b.dataset.name);if(!x)return;
  if(b.dataset.kact==='replace'){
    const s=keyChoices().find(s=>s.keys.some(k=>k.name===x.name));if(!s)return;
    el('keysvc').value=s.id;svcChanged();el('keywhich').value=x.name;whichChanged();
    el('keytitle').textContent=tr(x.where==='stored'?'key_form_replace':'key_form_add',{label:ktitle(x)});el('keycancel').hidden=false;
    el('keyform').scrollIntoView({behavior:'smooth',block:'center'});el('keyval').focus({preventScroll:true});return;}
  if(!confirm(tr('key_delete_confirm',{label:ktitle(x)})))return;
  const r=await fetch('/api/keys/'+encodeURIComponent(x.name),{method:'DELETE',headers:H});const j=await r.json().catch(()=>({}));
  el('keymsg').textContent=r.ok?tr('key_deleted',{label:ktitle(x)}):(j.detail||tr('failed',{code:r.status}));
  loadKeys();load();});
document.addEventListener('click',async e=>{if(!e.target.closest('#keyimp'))return;
  if(!confirm(tr('key_import_confirm')))return;
  const r=await fetch('/api/keys/import',{method:'POST',headers:H}); const j=await r.json().catch(()=>({}));
  el('keymsg').textContent=r.ok?tr('key_imported',{n:j.moved.length}):(j.detail||tr('failed',{code:r.status}));
  loadKeys();});
async function dec(id,d){let note='';
  if(d==='edit'){note=(prompt(tr('ask_change'))||'').trim();if(!note)return;}
  if(d==='drop'){note=(prompt(tr('ask_drop'))||'').trim();if(!note)return;}
  const r=await fetch(d==='undo'?'/api/undo/'+encodeURIComponent(id):'/api/approve/'+encodeURIComponent(id),{method:'POST',headers:H,body:JSON.stringify({decision:d,note})});
  if(!r.ok)alert((await r.json().catch(()=>({}))).detail||tr('failed',{code:r.status}));
  load();}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)dec(b.dataset.id,b.dataset.d);});
load();loadOrders();loadKeys();setInterval(load,60000);setInterval(loadOrders,120000);
</script>
</body>
</html>
